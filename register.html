<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('signup.jpg'); /* Update this with your actual image path */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .signup-container {
            background: rgba(255, 255, 255, 0.1); /* Glass effect */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 350px;
            backdrop-filter: blur(10px);
        }
        .signup-container h2 {
            margin-bottom: 20px;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px; /* Oval input */
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
            outline: none;
            text-align: center;
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        .signup-btn {
            width: 100%;
            background: linear-gradient(90deg, #00ff99, #007bff);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px; /* Oval button */
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }
        .signup-btn:hover {
            background: linear-gradient(90deg, #00cc88, #0056b3);
        }
        .login-link {
            margin-top: 15px;
            display: block;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>SIGNUP</h2>
        <form action="register.jsp" method="post">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password (8 characters)" required>
            </div>
            <button type="submit" class="signup-btn">Signup</button>
        </form>
        <a href="login.html" class="login-link">Already have an account? Login</a>
    </div>

</body>
</html>
